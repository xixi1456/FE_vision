# enemy_color: "red"
enemy_color: "blue"

#####-----神经网络参数(NNdeployment Infantry-v8)-----#####
yolo_name: nndeploy
# v8n 模型（OpenVINO IR, fp16）
nn_model_path: assets/Infantry-v8n-fp16-20260726-D1.8w-B16.xml
nn_device: GPU
nn_conf_threshold: 0.5
nn_infer_mode: sync
# nn_keep_both: true   # 调试用：my_color=2，保留蓝红双方/全部白色结果；默认关闭(库内按我方颜色过滤友方)
classify_model: assets/tiny_resnet.onnx
yolo11_model_path: assets/yolo11.xml
yolov8_model_path: assets/yolov8.xml
yolov5_model_path: assets/yolov5.xml
device: GPU
min_confidence: 0.8
use_traditional: true

#####-----ROI-----#####
roi: 
  x: 420
  y: 50
  width: 600
  height: 600

use_roi: false

#####-----传统方法参数-----#####
threshold: 150
max_angle_error: 45 # degree
min_lightbar_ratio: 1.5
max_lightbar_ratio: 20
min_lightbar_length: 8
min_armor_ratio: 1
max_armor_ratio: 5
max_side_ratio: 1.5
max_rectangular_error: 25 # degree

#####-----tracker参数-----#####
min_detect_count: 5
max_temp_lost_count: 15
outpost_max_temp_lost_count: 75

#####-----aimer参数-----#####
yaw_offset: -0.5 # degree -2.5
pitch_offset: 0 # degree 2
comming_angle: 60 # degree
leaving_angle: 20 # degree
decision_speed: 7 # rad/s
high_speed_delay_time: 0.0 # s
low_speed_delay_time: 0.02 # s planner use this value

#####-----shooter参数-----#####
first_tolerance: 3 # 近距离射击容差，degree
second_tolerance: 2 # 远距离射击容差，degree
judge_distance: 2 #距离判断阈值
auto_fire: true # 是否由自瞄控制射击

camera_name: "hikrobot"
exposure_ms: 2.5
gain: 16.9
vid_pid: "2bdf:0001"

#  1  0  0
#  0  1  0
#  0  0  1
R_gimbal2imubody: [1, 0, 0, 0, 1, 0, 0, 0, 1]

# 重投影误差: 0.1897px
camera_matrix: [1217.9844156864679, 0, 653.46394011146765, 0, 1206.6386757356142, 537.56009512082142, 0, 0, 1]
distort_coeffs: [-0.10160716814676535, 0.085575328434024545, 0.0092940571970437248, -0.0036118342526684465, 0]

# 相机同理想情况的偏角: yaw-0.99 pitch0.80 roll1.02 degree
# 标定板到世界坐标系原点的水平距离: 2.27 m
# 标定板同竖直摆放时的偏角: yaw-5.64 pitch32.47 roll1.32 degree
R_camera2gimbal: [0.017532822458566528, 0.013597217873253218, 0.99975382760094678, -0.99968787357260536, 0.018037114689646375, 0.017286350845548932, -0.017797628171170792, -0.99974485653079492,0.013909215351734368]
t_camera2gimbal: [0.066702812985102347, -0.022872505925352293, 0.02827173483456628]

#####-----cboard参数-----#####
quaternion_canid: 0x100
bullet_speed_canid: 0x101
send_canid: 0xff
can_interface: "can0"

#####-----gimbal参数-----#####
com_port: "/dev/ttyACM0"
# 云台pitch一阶低通滤波系数，越小越平滑
pitch_filter_alpha: 0.9
yaw_kp: 0
yaw_kd: 0
pitch_kp: 0
pitch_kd: 0

#####-----planner-----#####
fire_thresh: 0.0035

max_yaw_acc: 50
Q_yaw: [9e6, 0]
R_yaw: [1]

max_pitch_acc: 100
Q_pitch: [9e6, 0]
R_pitch: [1]

#####-----buff_detector参数-----#####
model: "assets/yolo11_buff_int8.xml"

#####-----buff_aimer参数-----#####
fire_gap_time: 0.700   # s
predict_time: 0.120     # s

height: 2
grid_num: 100
grid_size: 1
delay: 0
